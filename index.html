  <template id="tpl-manejo-emocional">

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">01.</span> Introducción</h2>
      <div class="pf-lead pf-text">
        <p>El manejo emocional es una parte importante del desarrollo personal y académico, ya que permite reconocer
          nuestras emociones, comprender qué situaciones las provocan y aprender a responder de una manera adecuada.</p>
        <p>Durante mi formación como estudiante de Ingeniería Informática he identificado algunas situaciones académicas
          que pueden generar frustración, presión e inseguridad. Analizarlas me permite reconocer aspectos que necesito
          mejorar y desarrollar estrategias para afrontar de mejor manera los retos que se presentan durante mi
          aprendizaje y trabajo en equipo.</p>
      </div>
    </section>

    <section class="pf-block">
      <h2 class="pf-h2 reveal"><span class="mono">02.</span> Análisis de situaciones académicas</h2>

      <article class="pf-situation reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Situación 1</span>
          <h3>Dificultad de concentración y aprendizaje</h3>
        </div>
        <span class="pf-label mono">Descripción</span>
        <p class="pf-desc">Una de las dificultades que he identificado durante mi formación académica es mantener la
          atención cuando se presentan temas teóricos demasiado extensos. En ocasiones, esto provoca que no logre
          comprender completamente los contenidos. Esta situación también se refleja durante las actividades prácticas,
          especialmente cuando debo realizar algún ejercicio y no cuento con los conocimientos suficientes para
          desarrollarlo.</p>
        <div class="pf-facts">
          <div class="pf-fact emo"><span class="pf-label mono">Emociones</span>
            <p>Frustración, confusión y desmotivación.</p>
          </div>
          <div class="pf-fact det"><span class="pf-label mono">Detonante</span>
            <p>La extensión de los contenidos teóricos y la falta de comprensión de algunos conocimientos necesarios
              para realizar las prácticas.</p>
          </div>
          <div class="pf-fact res"><span class="pf-label mono">Mi respuesta</span>
            <p>Puedo perder la concentración, tener dificultades para avanzar y sentir frustración al no conseguir los
              resultados esperados.</p>
          </div>
          <div class="pf-fact est"><span class="pf-label mono">Estrategia</span>
            <p>Dividir los temas en pequeñas secciones, elaborar apuntes, identificar mis dudas y buscar ejemplos
              prácticos que faciliten la comprensión.</p>
          </div>
        </div>
      </article>

      <article class="pf-situation reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Situación 2</span>
          <h3>Presión por la responsabilidad en un equipo</h3>
        </div>
        <span class="pf-label mono">Descripción</span>
        <p class="pf-desc">Cuando participo en proyectos o prototipos escolares y soy el encargado de desarrollar la
          parte práctica, siento una responsabilidad importante por conseguir buenos resultados. Esto se vuelve
          especialmente complicado cuando aparecen dificultades técnicas que impiden avanzar como esperaba, ya que
          considero que el resultado de mi trabajo también influye en el desempeño de mis compañeros.</p>
        <div class="pf-facts">
          <div class="pf-fact emo"><span class="pf-label mono">Emociones</span>
            <p>Estrés, presión e inseguridad.</p>
          </div>
          <div class="pf-fact det"><span class="pf-label mono">Detonante</span>
            <p>Encontrarme con dificultades durante el desarrollo y sentir que debo cumplir con las expectativas del
              equipo.</p>
          </div>
          <div class="pf-fact res"><span class="pf-label mono">Mi respuesta</span>
            <p>Puedo preocuparme demasiado por los resultados y sentir presión al intentar resolver todos los problemas.
            </p>
          </div>
          <div class="pf-fact est"><span class="pf-label mono">Estrategia</span>
            <p>Organizar las tareas por prioridades, mantener la calma ante los errores, comunicar las dificultades y
              solicitar apoyo cuando sea necesario.</p>
          </div>
        </div>
      </article>

      <article class="pf-situation reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Situación 3</span>
          <h3>Evitar asumir el liderazgo</h3>
        </div>
        <span class="pf-label mono">Descripción</span>
        <p class="pf-desc">En algunas actividades grupales he identificado que tengo la capacidad de participar como
          líder y coordinar el trabajo de mis compañeros. Sin embargo, en ocasiones he preferido no asumir ese papel
          debido a que implica tomar decisiones, organizar actividades y responsabilizarme de ciertos resultados. Esto
          ha provocado que deje pasar oportunidades para desarrollar mis capacidades de liderazgo.</p>
        <div class="pf-facts">
          <div class="pf-fact emo"><span class="pf-label mono">Emociones</span>
            <p>Inseguridad, duda y temor a equivocarme.</p>
          </div>
          <div class="pf-fact det"><span class="pf-label mono">Detonante</span>
            <p>La responsabilidad que implica dirigir un equipo y tomar decisiones que pueden influir en el resultado
              del trabajo.</p>
          </div>
          <div class="pf-fact res"><span class="pf-label mono">Mi respuesta</span>
            <p>Prefiero mantenerme en un papel de integrante del equipo, aunque tenga la posibilidad de aportar más
              desde una posición de liderazgo.</p>
          </div>
          <div class="pf-fact est"><span class="pf-label mono">Estrategia</span>
            <p>Fortalecer mi confianza, aceptar responsabilidades progresivamente y comprender que liderar también
              significa escuchar, colaborar y aprender de los errores.</p>
          </div>
        </div>
      </article>
    </section>

    <section class="pf-block">
      <h2 class="pf-h2 reveal"><span class="mono">03.</span> Aplicación de una estrategia de autorregulación</h2>
      <div class="pf-selected reveal">
        <div class="pf-fact det"><span class="pf-label mono">Situación seleccionada</span>
          <p>Presión por la responsabilidad en un equipo.</p>
        </div>
        <div class="pf-fact est"><span class="pf-label mono">Estrategia</span>
          <p>Organización y resolución progresiva de problemas.</p>
        </div>
      </div>
      <div class="pf-text reveal">
        <p>La estrategia consiste en evitar que la presión por conseguir resultados me impida pensar con claridad. Para
          ello, propongo aplicar los siguientes pasos:</p>
      </div>
      <ol class="pf-steps">
        <li class="reveal"><strong>Identificar el problema:</strong> reconocer qué parte del proyecto está presentando
          dificultades.</li>
        <li class="reveal"><strong>Organizar las tareas:</strong> dividir el problema en actividades más pequeñas y
          establecer prioridades.</li>
        <li class="reveal"><strong>Buscar alternativas:</strong> analizar diferentes maneras de solucionar el
          inconveniente sin apresurarme.</li>
        <li class="reveal"><strong>Comunicarme con el equipo:</strong> compartir los avances y dificultades para recibir
          opiniones y apoyo.</li>
        <li class="reveal"><strong>Evaluar los resultados:</strong> revisar qué funcionó y qué aspectos necesitan
          mejorar.</li>
      </ol>

      <div class="pf-compare">
        <div class="pf-col before reveal">
          <h3>ANTES</h3>
          <ul>
            <li>Sentir que toda la responsabilidad depende de mí.</li>
            <li>Preocuparme demasiado cuando algo no funciona.</li>
            <li>Intentar resolver todo rápidamente.</li>
            <li>Sentir presión por los resultados.</li>
          </ul>
        </div>
        <div class="pf-col after reveal">
          <h3>DESPUÉS <small>Resultado esperado</small></h3>
          <ul>
            <li>Reconocer que el proyecto es un esfuerzo colectivo.</li>
            <li>Analizar el problema con mayor tranquilidad.</li>
            <li>Dividir las dificultades y establecer prioridades.</li>
            <li>Concentrarme en el proceso y la búsqueda de soluciones.</li>
          </ul>
        </div>
      </div>
      <p class="pf-note reveal"><strong>Aclaración:</strong> el apartado DESPUÉS representa los resultados esperados de
        aplicar la estrategia, no una experiencia ya comprobada.</p>
    </section>

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">04.</span> Reflexión individual</h2>
      <div class="pf-quote pf-text">
        <p>Al analizar estas situaciones, me doy cuenta de que el manejo emocional influye directamente en mi desempeño
          académico y en la manera en que trabajo con otras personas. Reconozco que necesito mejorar mi concentración
          cuando estudio temas teóricos, aprender a controlar la presión cuando tengo responsabilidades importantes y
          tener mayor confianza para asumir el liderazgo dentro de un equipo. En situaciones similares, buscaré
          organizar mejor mis actividades, tomar los problemas con mayor tranquilidad y no tener miedo de pedir apoyo
          cuando sea necesario. También quiero aprovechar las oportunidades para desarrollar mis capacidades de
          liderazgo, entendiendo que equivocarme forma parte del aprendizaje y que cada experiencia puede ayudarme a
          mejorar tanto personal como académicamente.</p>
      </div>
    </section>

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">05.</span> Conclusión</h2>
      <div class="pf-text">
        <p>El desarrollo de esta actividad me permitió identificar algunas situaciones que pueden afectar mi desempeño
          durante la formación académica y reconocer que no siempre reacciono de la mejor manera ante las dificultades.
        </p>
        <p>Comprendí que el manejo emocional no significa evitar los problemas o las emociones negativas, sino aprender
          a reconocerlas y desarrollar herramientas para enfrentarlas. También considero importante fortalecer mi
          confianza, mejorar mi organización y aprender a trabajar bajo presión sin olvidar que el trabajo en equipo
          implica compartir responsabilidades.</p>
        <p>Estos aprendizajes pueden ayudarme a desenvolverme mejor tanto en mis actividades académicas como en mi
          futuro desarrollo profesional.</p>
      </div>
    </section>

  </template>

  <template id="tpl-creatividad">

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">01.</span> Información general</h2>
      <div class="pf-selected">
        <div class="pf-fact res"><span class="pf-label mono">Fecha</span>
          <p>6 de noviembre de 2026</p>
        </div>
        <div class="pf-fact est"><span class="pf-label mono">Título de la actividad</span>
          <p>Optimización de la distribución de salones en el edificio de Informática.</p>
        </div>
      </div>
    </section>

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">02.</span> Contexto</h2>
      <div class="pf-lead pf-text">
        <p>En el edificio de Informática existe una sala de cómputo que utilizan diferentes grupos, principalmente
          estudiantes de primer semestre que todavía no cuentan con computadora propia. Sin embargo, mi grupo de quinto
          semestre tiene asignada esa sala como salón habitual, aunque la mayoría de mis compañeros cuenta con equipo
          personal.</p>
        <p>Cuando los grupos de primer semestre necesitan utilizar la sala, mi grupo debe trasladarse a otras aulas.
          Esta organización genera cambios de salón durante la semana y no siempre permite aprovechar adecuadamente las
          computadoras institucionales.</p>
      </div>
    </section>

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">03.</span> Problema observado</h2>
      <div class="pf-text">
        <p>La distribución actual de los salones no considera completamente las necesidades tecnológicas de cada grupo.
          Esto provoca movimientos entre aulas y hace que algunos equipos institucionales permanezcan sin utilizarse
          mientras otros estudiantes podrían necesitarlos.</p>
      </div>
    </section>

    <section class="pf-block">
      <h2 class="pf-h2 reveal"><span class="mono">04.</span> Tres ideas y criterio de selección</h2>
      <p class="pf-text reveal">Se plantearon tres alternativas:</p>

      <article class="pf-situation pf-idea selected reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Idea 1</span>
          <h3>Redistribución estratégica de salones</h3>
          <span class="pf-status ready mono">Propuesta seleccionada</span>
        </div>
        <p class="pf-desc">Asignar los espacios considerando las necesidades tecnológicas de cada grupo, dando
          prioridad a la sala de cómputo para quienes necesitan utilizar los equipos institucionales.</p>
      </article>

      <article class="pf-situation pf-idea reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Idea 2</span>
          <h3>Sistema digital de asignación de aulas</h3>
        </div>
        <p class="pf-desc">Crear una plataforma donde se puedan consultar los horarios, grupos y disponibilidad de los
          salones.</p>
      </article>

      <article class="pf-situation pf-idea reveal">
        <div class="pf-sit-head">
          <span class="pf-sit-num mono">Idea 3</span>
          <h3>Calendario de uso de la sala de cómputo</h3>
        </div>
        <p class="pf-desc">Organizar los horarios de utilización de la sala para evitar conflictos entre los grupos
          que necesitan acceder a ella.</p>
      </article>

      <div class="pf-selected reveal">
        <div class="pf-fact est"><span class="pf-label mono">Propuesta seleccionada</span>
          <p>Redistribución estratégica de salones.</p>
        </div>
        <div class="pf-fact det"><span class="pf-label mono">Criterio de selección</span>
          <p>Se eligió esta alternativa porque permite atender directamente el problema mediante una mejor organización
            de los espacios existentes, sin depender de la construcción de nuevas instalaciones o de la implementación
            de un sistema adicional.</p>
        </div>
      </div>
    </section>

    <section class="pf-block">
      <h2 class="pf-h2 reveal"><span class="mono">05.</span> Prototipo</h2>
      <figure class="pf-figure reveal">
        <a href="prototipo.jpg" target="_blank" rel="noopener noreferrer"
          aria-label="Abrir la imagen del prototipo en tamaño completo">
          <img src="prototipo.jpg" alt="Prototipo de organización de espacios del edificio de Informática"
            loading="lazy" decoding="async" onerror="this.closest('.pf-figure').classList.add('missing')" />
        </a>
        <p class="pf-missing">La imagen del prototipo no se pudo cargar.</p>
        <figcaption class="mono">Prototipo visual · toca la imagen para verla en tamaño completo</figcaption>
      </figure>
      <div class="pf-text reveal">
        <p>Este prototipo representa una propuesta de distribución de los espacios, considerando las necesidades de los
          grupos y el aprovechamiento de los equipos institucionales.</p>
      </div>
      <p class="pf-note reveal"><strong>Aclaración:</strong> se trata de una propuesta académica sujeta a revisión y
        autorización institucional. No ha sido implementada.</p>
    </section>

    <section class="pf-block">
      <h2 class="pf-h2 reveal"><span class="mono">06.</span> Retroalimentación de un usuario</h2>
      <p class="pf-text reveal">La opinión fue proporcionada por un alumno de quinto semestre que conoce la situación
        actual.</p>
      <div class="pf-quote pf-text reveal">
        <p>El alumno comentó que sí existen cambios frecuentes de aula durante la semana. Explicó que algunos días el
          grupo utiliza la sala de cómputo durante toda la jornada, mientras que otros días debe alternar entre un aula
          convencional y su salón asignado.</p>
        <p>También consideró conveniente que los grupos que todavía no cuentan con computadoras propias tengan
          prioridad para utilizar la sala de cómputo, ya que los estudiantes de quinto semestre cuentan con equipo
          personal y, en ocasiones, las computadoras institucionales ocupan espacio sin ser utilizadas.</p>
        <p>Respecto a la propuesta, señaló que una mejor asignación de los salones podría ayudar a aprovechar la
          capacidad de los equipos disponibles. Finalmente, recomendó revisar y reorganizar el rol de las aulas de
          acuerdo con las necesidades de cada grupo.</p>
      </div>
      <div class="pf-lead pf-text reveal pf-conclusion">
        <span class="pf-label mono">Conclusión de la retroalimentación</span>
        <p>La opinión del alumno respalda la importancia de organizar los espacios considerando qué grupos necesitan
          realmente los equipos institucionales. Además, aporta la recomendación de mejorar la distribución semanal de
          las aulas para aprovechar mejor los recursos existentes.</p>
      </div>
    </section>

    <section class="pf-block reveal">
      <h2 class="pf-h2"><span class="mono">07.</span> Reflexión personal</h2>
      <p class="pf-text"><span class="pf-label mono">¿Por qué crees que tu propuesta aporta valor?</span></p>
      <div class="pf-quote pf-text">
        <p>Al desarrollar esta actividad comprendí que la creatividad no consiste únicamente en inventar algo nuevo,
          sino también en observar situaciones cotidianas e identificar oportunidades de mejora. En este caso, pude
          reconocer que la distribución de los salones de nuestro edificio de Informática genera movimientos entre
          grupos que podrían reducirse mediante una mejor organización. Considero que es importante tomar en cuenta las
          necesidades de cada semestre, especialmente las de los estudiantes que todavía no cuentan con equipo propio.
          Esta propuesta me permitió pensar en cómo aprovechar mejor los recursos que ya existen dentro de nuestra
          institución. También aprendí que, antes de plantear una solución, es necesario analizar el problema,
          considerar diferentes alternativas y escuchar las opiniones de otras personas.</p>
      </div>
    </section>

    <!-- ===== ACTIVIDAD 3: MIS PROYECTOS DE SOFTWARE Y PROTOTIPOS ===== -->
    <section id="actividad-3" class="act3">
      <div class="act3__container">
        <p class="act3__eje">Eje: Aprendizaje y proyectos</p>
        <h2 class="act3__title">Actividad 3. Mis proyectos de software y prototipos</h2>

        <!-- PROYECTO 1 -->
        <article class="act3-card">
          <header class="act3-card__header">
            <span class="act3-card__label">Proyecto 1</span>
            <h3>Control y Análisis de Consumo Energético para los Hogares</h3>
          </header>

          <div class="act3-block">
            <h4>Descripción</h4>
            <p>Desarrollo de un sistema de monitoreo energético orientado al análisis del consumo eléctrico en los
              hogares mediante tecnología IoT. El prototipo obtiene mediciones de corriente eléctrica, procesa la
              información y transmite los datos a una plataforma digital para su almacenamiento, consulta y
              visualización.</p>
          </div>

          <div class="act3-block">
            <h4>Desarrollo</h4>
            <p>Se utilizó una placa ESP32, un sensor de corriente y una pantalla LCD de 16x2 con comunicación I2C. Se
              implementó la lectura y procesamiento de señales mediante EmonLib. Posteriormente, se incorporó
              conectividad Wi-Fi para transmitir las mediciones a Google Apps Script y almacenarlas automáticamente en
              Google Sheets.</p>
            <p>También se desarrolló un panel web con HTML, CSS, JavaScript y Chart.js para visualizar gráficamente los
              registros y consultar las mediciones recientes.</p>
          </div>

          <div class="act3-block">
            <h4>Tecnologías</h4>
            <ul class="act3-tags">
              <li>ESP32 y sensor de corriente</li>
              <li>LCD 16x2 con I2C</li>
              <li>C++ y EmonLib</li>
              <li>Wi-Fi e IoT</li>
              <li>Google Apps Script y Google Sheets</li>
              <li>HTML, CSS, JavaScript y Chart.js</li>
            </ul>
          </div>

          <div class="act3-block">
            <h4>Resultados</h4>
            <p>Se obtuvo un prototipo funcional capaz de recopilar, transmitir, almacenar y visualizar mediciones
              eléctricas. Se fortalecieron conocimientos de electrónica, microcontroladores, comunicación inalámbrica,
              servicios en la nube y desarrollo web.</p>
          </div>

          <div class="act3-block">
            <h4>Evidencia</h4>
            <figure class="act3-figure">
              <button type="button" class="act3-zoom js-act3-zoom" aria-label="Ampliar imagen de evidencia">
                <img src="ev_sensor.jpg"
                  alt="Evidencia del prototipo de monitoreo energético con ESP32 y sensor de corriente" loading="lazy">
              </button>
              <figcaption>Haz clic en la imagen para ampliarla.</figcaption>
            </figure>
          </div>
        </article>

        <!-- PROYECTO 2 -->
        <article class="act3-card">
          <header class="act3-card__header">
            <span class="act3-card__label">Proyecto 2</span>
            <h3>Sistema Web de Gestión de Vacantes para Programadores</h3>
          </header>
